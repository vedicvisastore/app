name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push cancels an older in-flight check (never a running deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:check
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      # Baked into the build. Set as repo *variables* (Settings → Variables) once the domain is live:
      #   SITE_URL=https://vedicvisa.com   ADMIN_HOST=admin.vedicvisa.com
      # Left empty, the site works on its workers.dev address with admin at /admin.
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      ADMIN_HOST: ${{ vars.ADMIN_HOST }}
    steps:
      # Skip (don't fail) until the repo secrets exist, so early pushes stay green.
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ "$HAS_DB" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and DATABASE_URL in GitHub → Settings → Secrets → Actions."
          fi
        env:
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'

      # Database migrations run before the new code goes live (they only add, never drop).
      - name: Migrate database
        if: steps.gate.outputs.ready == 'true'
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build for Workers
        if: steps.gate.outputs.ready == 'true'
        run: npm run cf:build

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx opennextjs-cloudflare deploy
